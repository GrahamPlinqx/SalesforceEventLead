<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick Lead Capture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }
    h1 {
      font-size: 18px;
      margin-bottom: 14px;
    }
    label {
      font-size: 13px;
      margin-top: 12px;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #d0d5dd;
      margin-top: 4px;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: #0176d3;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Let’s stay in touch</h1>

      <!-- SALESFORCE FORM GOES HERE -->

    </div>
  </div>
</body>
</html>
